<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stock Opname Mandiri</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <script src="[https://unpkg.com/html5-qrcode](https://unpkg.com/html5-qrcode)" type="text/javascript"></script>
    <script src="[https://cdn.jsdelivr.net/npm/dexie@3.2.3/dist/dexie.js](https://cdn.jsdelivr.net/npm/dexie@3.2.3/dist/dexie.js)"></script>
</head>
<body>
    <!-- App Container -->
    <div id="app" class="app-container">
        <!-- LOGIN VIEW -->
        <div id="view-login" class="view active">
            <div class="login-box card-glass">
                <div class="logo-area">
                    <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                    <h2>Stock Opname</h2>
                    <p class="subtitle">Enterprise Edition</p>
                </div>
                
                <form id="loginForm">
                    <div class="input-group">
                        <input type="text" id="username" placeholder="Username" required>
                    </div>
                    <div class="input-group pass-group">
                        <input type="password" id="password" placeholder="Password (Min. 6 Karakter)" minlength="6" required>
                        <span id="togglePassword" class="eye-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </span>
                    </div>
                    <button type="submit" class="btn-primary" id="btnLogin">Masuk</button>
                    <a href="#" class="forgot-link">Lupa Password?</a>
                </form>
                
                <button id="btnInstall" class="btn-secondary hidden" style="margin-top:20px;">Instal Aplikasi</button>
            </div>
        </div>

        <!-- DASHBOARD VIEW -->
        <div id="view-dashboard" class="view">
            <header class="app-header">
                <div>
                    <h1 class="header-title">Dashboard</h1>
                    <p class="user-greeting">Halo, <span id="staffName">Staff</span></p>
                </div>
                <button id="btnLogout" class="btn-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </button>
            </header>
            <div class="menu-grid">
                <div class="menu-card" onclick="navigate('so')">
                    <div class="icon-box blue"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg></div>
                    <h3>Menu SO</h3>
                </div>
                <div class="menu-card" onclick="navigate('verify')">
                    <div class="icon-box green"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg></div>
                    <h3>Verifikasi</h3>
                </div>
                <div class="menu-card" onclick="navigate('history')">
                    <div class="icon-box orange"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg></div>
                    <h3>History</h3>
                </div>
                <div class="menu-card" onclick="navigate('report')">
                    <div class="icon-box purple"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg></div>
                    <h3>Report</h3>
                </div>
            </div>
            
            <div id="adminPanel" class="hidden">
                <h3 class="section-title">Menu Admin</h3>
                <div class="menu-grid">
                    <div class="menu-card outline"><h3 style="font-size: 14px;">User Management</h3></div>
                    <div class="menu-card outline"><h3 style="font-size: 14px;">Approval Lokasi</h3></div>
                </div>
            </div>
        </div>

        <!-- MENU SO VIEW -->
        <div id="view-so" class="view">
            <header class="app-header sub-header">
                <button class="btn-icon" onclick="navigate('dashboard')">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
                <h1 class="header-title">Input SO</h1>
                <div style="width:24px;"></div>
            </header>
            
            <div class="form-container">
                <!-- Location Panel -->
                <div class="card-glass p-15">
                    <label>Lokasi SO</label>
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="soLocation" placeholder="Scan/Input Lokasi" required>
                        <button class="btn-primary" style="width:auto; padding:0 15px;">Set</button>
                    </div>
                </div>

                <!-- Scanner Module -->
                <div class="card-glass mt-15 p-15">
                    <div id="reader" style="width:100%; border-radius:12px; overflow:hidden;"></div>
                    <div class="action-row mt-15">
                        <button id="btnScan" class="btn-primary" style="flex:1;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle; margin-right:5px;"><path d="M4 7V4h3M20 7V4h-3M4 17v3h3M20 17v3h-3M9 12h6"></path></svg> Scan Barcode
                        </button>
                        <button id="btnTorch" class="btn-secondary" style="width:auto; padding:10px;">
                           <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                        </button>
                    </div>
                    <div style="text-align:center; margin-top:10px;">
                        <span style="font-size:12px; color:#8e8e93;">Manual Input:</span>
                        <input type="text" id="manualBarcode" placeholder="Ketik Kode UPC / SKU" style="margin-top:5px;">
                    </div>
                </div>

                <!-- Product Result Info -->
                <div id="productInfo" class="card-glass mt-15 p-15 hidden">
                    <h3 id="resDesc" style="margin-bottom:5px;">Nama Produk</h3>
                    <p style="color:#8e8e93; font-size:13px;">UPC: <span id="resUpc"></span> | Dept: <span id="resDept"></span></p>
                    <div class="qty-sys-badge">Qty System: <span id="resQtySys">0</span></div>
                    
                    <div class="input-group mt-15">
                        <label>Qty SO Aktik (Fisik) *</label>
                        <input type="number" id="inputQty" placeholder="Masukkan Qty" required>
                    </div>
                    <div class="input-group">
                        <label>Keterangan (Opsional)</label>
                        <input type="text" id="inputKet" placeholder="Catatan tambahan">
                    </div>
                    
                    <button class="btn-primary mt-15" id="btnSaveSO">Simpan Data</button>
                </div>
            </div>
        </div>
        
        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="loading-overlay hidden">
            <div class="spinner"></div>
            <p>Memproses...</p>
        </div>
    </div>
    
    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
