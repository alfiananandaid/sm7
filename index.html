<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stock Opname Mandiri</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FFFFFF">

  <!-- External Libraries -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/quagga@0.12.10/dist/quagga.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

  <div class="app-viewport">
    <!-- GLASS HEADER -->
    <header class="ios-header">
      <div>
        <h1 id="page-title">Login</h1>
        <small id="user-info" style="color: var(--text-secondary); display: none;"></small>
      </div>
      <button id="btn-sync" onclick="syncData()" style="display:none; background:none; border:none;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#007AFF"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
      </button>
    </header>

    <!-- SECTION LOGIN -->
    <section id="sec-login" class="ios-card">
      <div class="ios-input-group">
        <label>Username</label>
        <input type="text" id="login-username" class="ios-input" placeholder="Masukkan username">
      </div>
      <div class="ios-input-group">
        <label>Password (Min 6 Karakter)</label>
        <div class="ios-input-wrapper">
          <input type="password" id="login-password" class="ios-input" placeholder="••••••••">
          <span onclick="togglePasswordVisibility()" style="position: absolute; right: 12px; cursor: pointer;">👁️</span>
        </div>
      </div>
      <button class="ios-btn ios-btn-primary" onclick="login()">Masuk Application</button>
      <p style="text-align: center; margin-top: 12px;">
        <a href="#" onclick="alert('Hubungi Admin untuk reset password')" style="color: var(--primary); font-size: 13px; text-decoration: none;">Lupa Password?</a>
      </p>
      
      <div id="pwa-install-container" style="margin-top: 20px; display: none;">
        <button class="ios-btn ios-btn-secondary" id="btn-install-pwa">📱 Install ke HP (Android / iOS)</button>
      </div>
    </section>

    <!-- SECTION MENU SO (STOCK OPNAME) -->
    <section id="sec-so" class="ios-card" style="display: none;">
      <div class="ios-input-group">
        <label>Lokasi Stock Opname</label>
        <div style="display: flex; gap: 8px;">
          <select id="so-lokasi" class="ios-input"></select>
          <button class="ios-btn ios-btn-secondary" style="width: auto;" onclick="openLocationModal()">+</button>
        </div>
      </div>

      <div class="ios-input-group">
        <label>Scan / Input Barcode</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="so-barcode" class="ios-input" placeholder="Scan/Input UPC/Artikel" onchange="lookupBarcode()">
          <button class="ios-btn ios-btn-primary" style="width: 50px;" onclick="openScanner()">📷</button>
        </div>
      </div>

      <!-- SCANNER MODAL / VIEW -->
      <div id="scanner-wrapper" style="display: none; margin-bottom: 14px;">
        <div id="scanner-container">
          <div class="scanner-focus-crosshair"></div>
        </div>
        <div style="display: flex; justify-content: space-between; margin-top: 8px;">
          <select id="scanner-engine" class="ios-input" style="width: 60%;" onchange="switchScannerEngine()">
            <option value="html5qr">Html5Qrcode Engine</option>
            <option value="quagga">QuaggaJS Engine</option>
          </select>
          <button class="ios-btn ios-btn-secondary" style="width: 35%;" onclick="toggleFlashlight()">🔦 Senter</button>
        </div>
      </div>

      <!-- DETIL PRODUCT (AUTO POPULATE) -->
      <div id="product-details" style="background: #F9F9FB; padding: 12px; border-radius: 12px; margin-bottom: 14px; font-size: 13px;">
        <div><b>Deskripsi:</b> <span id="so-deskripsi">-</span></div>
        <div><b>Dept:</b> <span id="so-dept">-</span> | <b>Vendor:</b> <span id="so-vendor">-</span></div>
        <div id="qty-system-container"><b>Qty System:</b> <span id="so-qty-system" style="color: var(--primary); font-weight: bold;">-</span></div>
      </div>

      <div class="ios-input-group">
        <label>Qty Fisik SO *</label>
        <input type="number" id="so-qty" class="ios-input" placeholder="0">
      </div>

      <div class="ios-input-group">
        <label>Keterangan (Opsional)</label>
        <input type="text" id="so-ket" class="ios-input" placeholder="Contoh: Barang Rusak/Dus Terbuka">
      </div>

      <button class="ios-btn ios-btn-primary" onclick="saveSO()">Simpan Data SO</button>

      <!-- HISTORY ITEM -->
      <div style="margin-top: 18px;">
        <label style="font-size: 12px; color: var(--text-secondary); font-weight: bold;">HISTORY SCAN BARCODE INI</label>
        <div id="so-history-list" style="margin-top: 8px; font-size: 12px;"></div>
      </div>
    </section>

    <!-- SECTION VERIFIKASI -->
    <section id="sec-verifikasi" class="ios-card" style="display: none;">
      <div class="ios-input-group">
        <input type="text" id="verif-search" class="ios-input" placeholder="Cari Dept / SKU / Lokasi..." oninput="renderVerifikasiList()">
      </div>
      <div id="verif-list"></div>
    </section>

    <!-- SECTION REPORT -->
    <section id="sec-report" class="ios-card" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3>Ringkasan SO</h3>
        <button class="ios-btn ios-btn-secondary" style="width: auto; padding: 6px 12px;" onclick="exportToExcel()">📊 Excel</button>
      </div>
      <div id="report-summary"></div>
    </section>

    <!-- SECTION ADMIN PANEL -->
    <section id="sec-admin" class="ios-card" style="display: none;">
      <h3>Admin Dashboard</h3>
      <div style="margin: 12px 0;">
        <label><input type="checkbox" id="toggle-qty-sys" onchange="toggleQtySystemSetting(this.checked)"> Tampilkan Qty System ke Staff</label>
      </div>
      <hr style="border: 0.5px solid var(--border-color); margin: 12px 0;">
      <h4>Kelola User</h4>
      <div class="ios-input-group" style="margin-top: 8px;">
        <input type="text" id="admin-user-name" class="ios-input" placeholder="Nama Staff">
        <input type="text" id="admin-user-uname" class="ios-input" placeholder="Username" style="margin-top: 6px;">
        <input type="password" id="admin-user-pass" class="ios-input" placeholder="Password" style="margin-top: 6px;">
        <select id="admin-user-role" class="ios-input" style="margin-top: 6px;">
          <option value="staff">Staff</option>
          <option value="admin">Admin</option>
        </select>
        <button class="ios-btn ios-btn-primary" style="margin-top: 8px;" onclick="addAdminUser()">+ Tambah User</button>
      </div>
    </section>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="ios-nav" id="app-nav" style="display: none;">
      <div class="nav-item active" onclick="switchTab('so')">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
        <span>SO</span>
      </div>
      <div class="nav-item" onclick="switchTab('verifikasi')">
        <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        <span>Verifikasi</span>
      </div>
      <div class="nav-item" onclick="switchTab('report')">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
        <span>Report</span>
      </div>
      <div class="nav-item admin-only" onclick="switchTab('admin')" style="display: none;">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span>Admin</span>
      </div>
      <div class="nav-item" onclick="logout()">
        <svg viewBox="0 0 24 24"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
        <span>Keluar</span>
      </div>
    </nav>

    <!-- MODAL DUPLICATE OVERWRITE / ADD -->
    <div class="modal-overlay" id="modal-duplicate">
      <div class="modal-card">
        <h3>Item Sudah Pernah Scanned!</h3>
        <p style="font-size: 13px; color: var(--text-secondary); margin: 8px 0;" id="dup-msg"></p>
        <div style="display: flex; gap: 8px; margin-top: 14px;">
          <button class="ios-btn ios-btn-primary" onclick="confirmDuplicateAction('replace')">Replace (Timpa)</button>
          <button class="ios-btn ios-btn-secondary" onclick="confirmDuplicateAction('add')">Add (Tambah Qty)</button>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
