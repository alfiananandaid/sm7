<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SO MANDIRI</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f2f2f7">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode/html5-qrcode.min.js"></script>
</head>
<body>

  <!-- TOAST NOTIFICATION (PENGGANTI LOADING LAMA) -->
  <div id="toastNotification" class="ios-toast hidden">
    <div class="toast-content">
      <svg id="toastIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
      <span id="toastMessage">Pesan...</span>
    </div>
  </div>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="screen active">
    <div class="login-wrapper">
      <div class="brand-header">
        <svg class="app-icon" viewBox="0 0 100 100" fill="none">
          <rect width="100" height="100" rx="24" fill="#007aff"/>
          <path d="M30 35H70M30 50H70M30 65H50" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
        </svg>
        <h2>Stock Opname</h2>
        <p>Enterprise System</p>
      </div>

      <form id="loginForm" class="ios-card login-card">
        <div class="input-group">
          <input type="text" id="loginUsername" placeholder="Username" required autocomplete="off">
        </div>
        <div class="input-group password-group">
          <input type="password" id="loginPassword" placeholder="Password" minlength="6" required>
          <button type="button" id="togglePasswordBtn" class="icon-btn-inline">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
        <button type="submit" id="btnLogin" class="ios-btn primary-btn">Login ke Sistem</button>
      </form>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="appContainer" class="app-container hidden">

    <!-- TOP HEADER -->
    <header class="ios-navbar">
      <div class="nav-left">
        <h1 class="nav-title">Stock Opname</h1>
        <span class="user-role-badge" id="displayUserRole">STAFF</span>
      </div>
      <button id="btnLogout" class="ios-btn-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ff3b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      </button>
    </header>

    <!-- CONTENT AREA -->
    <main class="content-area">
      <!-- TAB CONTENT: SO -->
      <section id="tabSO" class="tab-content active">
        <!-- LOKASI CARD (NEW SMART INPUT) -->
        <div class="ios-card">
          <label class="section-label">1. Lokasi Barang</label>
          <div class="smart-input-row">
            <input type="text" id="inputLokasi" class="ios-input flex-1" placeholder="Cari / Ketik / Scan Lokasi..." autocomplete="off">
            <button id="btnScanLokasi" class="ios-btn-icon gray-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h3m13 3V4h-3M4 17v3h3m13-3v3h-3M9 9h6v6H9z"/></svg></button>
            <button id="btnAddLocation" class="ios-btn-icon blue-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
          </div>
          <ul id="lokasiSuggestion" class="autocomplete-list hidden"></ul>
        </div>

        <!-- BARCODE CARD -->
        <div class="ios-card">
          <div class="card-header-split">
            <label class="section-label">2. Barcode Item</label>
          </div>
          <div class="smart-input-row">
            <input type="text" id="inputBarcode" class="ios-input flex-1" placeholder="Scan atau ketik UPC/SKU..." autocomplete="off">
            <button id="btnOpenScanner" class="ios-btn-icon blue-btn">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2M8 7h8v10H8z"/></svg>
            </button>
          </div>
          
          <div id="productDetailCard" class="product-details hidden">
            <div class="row"><span class="lbl">Deskripsi</span><span id="resDeskripsi" class="val">-</span></div>
            <div class="row"><span class="lbl">Dept / Vendor</span><span id="resDeptVendor" class="val">-</span></div>
            <div class="row qty-sys"><span class="lbl">Qty System</span><span id="resQtySystem" class="val bold">0</span></div>
          </div>
        </div>

        <!-- INPUT QTY & KETERANGAN -->
        <div class="ios-card">
          <div class="input-group">
            <label class="section-label">3. Qty Opname <span class="req">*</span></label>
            <input type="number" id="inputQtySo" class="ios-input large-input" placeholder="0" min="1">
          </div>
          <div class="input-group">
            <label class="section-label">4. Keterangan <span class="opt">(Opsional)</span></label>
            <input type="text" id="inputKeterangan" class="ios-input" placeholder="Catatan kondisi...">
          </div>
          <button id="btnSaveSo" class="ios-btn primary-btn big-btn">Simpan Data</button>
        </div>
      </section>

      <!-- TAB CONTENT LAINNYA (Disederhanakan untuk ruang) -->
      <section id="tabVerifikasi" class="tab-content"><div class="ios-card"><p>Data Verifikasi (Sedang Dimuat...)</p></div></section>
      <section id="tabHistory" class="tab-content"><div class="ios-card"><p>History Transaksi</p></div></section>
      <section id="tabAdmin" class="tab-content"><div class="ios-card"><p>Panel Admin</p></div></section>
    </main>

    <!-- MODERN BOTTOM NAVIGATION BAR -->
    <nav class="ios-bottom-nav">
      <button class="nav-item active" data-tab="tabSO">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span>Opname</span>
      </button>
      <button class="nav-item" data-tab="tabVerifikasi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        <span>Verifikasi</span>
      </button>
      <button class="nav-item" data-tab="tabHistory">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span>History</span>
      </button>
      <button class="nav-item admin-only hidden" data-tab="tabAdmin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        <span>Admin</span>
      </button>
    </nav>
  </div>

  <!-- SCANNER MODAL DENGAN UI MODERN -->
  <div id="scannerModal" class="modal-overlay hidden">
    <div class="scanner-modal-body">
      <div class="scanner-header">
        <span class="scanner-title">Arahkan ke Barcode</span>
        <button id="btnCloseScanner" class="icon-btn-round">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="scanner-viewport-wrapper">
        <div id="cameraViewport"></div>
        <!-- Rounded Corner SVG Focus -->
        <svg class="scanner-crosshair" viewBox="0 0 240 240" fill="none">
          <path d="M20 60V40a20 20 0 0120-20h20M180 20h20a20 20 0 0120 20v20M220 180v20a20 20 0 01-20 20h-20M60 220H40a20 20 0 01-20-20v-20" stroke="#007aff" stroke-width="6" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
